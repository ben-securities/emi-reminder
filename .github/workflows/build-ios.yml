name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: List Xcode Schemes
        run: xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build Xcode Archive (Unsigned for Sideloading)
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee xcodebuild.log || {
              echo "==== XCODEBUILD FAILED ===="
              python3 -c "
              for line in open('xcodebuild.log'):
                  if any(w in line.lower() for w in ['error:', 'fatal error:', '** archive failed **']):
                      print(f'::error::{line.strip()}')
              for line in open('xcodebuild.log').readlines()[-30:]:
                  print(f'::error::[TAIL] {line.strip()}')
              "
              exit 1
            }

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r EMI_Reminder.ipa Payload
          ls -lh EMI_Reminder.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMI_Reminder_iOS
          path: build/EMI_Reminder.ipa
          retention-days: 7

      - name: Release IPA on GitHub
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: EMI Reminder iOS v1.0.0
          files: build/EMI_Reminder.ipa
